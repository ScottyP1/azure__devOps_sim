<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>:root{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Azure DevOps Flight Sim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --azure:#0B78D0;
  --azure-soft:#E4F0FB;
  --azure-ink:#08529A;
  --ground:#F4F6F9;
  --surface:#FFFFFF;
  --surface-2:#EDF0F5;
  --border:#D8DEE8;
  --border-strong:#B9C2D0;
  --ink:#151A22;
  --ink-2:#4A5566;
  --ink-3:#7A8598;
  --ok:#107C41;
  --ok-soft:#E2F2E8;
  --fail:#C4314B;
  --fail-soft:#FBE6EA;
  --wait:#9A6C00;
  --wait-soft:#FBF0D8;
  --run:#0B78D0;
  --run-soft:#E4F0FB;
  --term-bg:#0E1420;
  --term-ink:#C9D6E8;
  --term-dim:#68788F;
  --term-green:#5CD68A;
  --term-red:#FF7A8F;
  --term-yellow:#F0C674;
  --term-blue:#6FB6F0;
  --shadow:0 1px 2px rgba(20,30,50,.09),0 6px 18px rgba(20,30,50,.07);
  --ui:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"Cascadia Mono","Consolas",monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --azure:#3FA0EC;
    --azure-soft:#16283A;
    --azure-ink:#8FCBF7;
    --ground:#101419;
    --surface:#171C24;
    --surface-2:#1F2630;
    --border:#2B333F;
    --border-strong:#3C4655;
    --ink:#E6EBF2;
    --ink-2:#A6B2C2;
    --ink-3:#75828F;
    --ok:#4FBE7C;
    --ok-soft:#14291D;
    --fail:#F2718A;
    --fail-soft:#2E171C;
    --wait:#DFAE45;
    --wait-soft:#2C2413;
    --run:#3FA0EC;
    --run-soft:#16283A;
    --term-bg:#0A0E16;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --azure:#3FA0EC;
  --azure-soft:#16283A;
  --azure-ink:#8FCBF7;
  --ground:#101419;
  --surface:#171C24;
  --surface-2:#1F2630;
  --border:#2B333F;
  --border-strong:#3C4655;
  --ink:#E6EBF2;
  --ink-2:#A6B2C2;
  --ink-3:#75828F;
  --ok:#4FBE7C;
  --ok-soft:#14291D;
  --fail:#F2718A;
  --fail-soft:#2E171C;
  --wait:#DFAE45;
  --wait-soft:#2C2413;
  --run:#3FA0EC;
  --run-soft:#16283A;
  --term-bg:#0A0E16;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--azure);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ---------- shell ---------- */
#app{display:flex;flex-direction:column;height:100vh;min-height:520px}
.topbar{display:flex;align-items:center;gap:14px;padding:0 14px;height:46px;background:var(--surface);border-bottom:1px solid var(--border);flex:none}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:-.01em}
.glyph{width:22px;height:22px;flex:none}
.crumbs{display:flex;align-items:center;gap:7px;color:var(--ink-3);font-size:12.5px;font-family:var(--mono)}
.crumbs b{color:var(--ink-2);font-weight:500}
.topbar .spacer{flex:1}
.tbtn{background:transparent;border:1px solid var(--border);padding:4px 10px;border-radius:4px;cursor:pointer;font-size:12.5px;color:var(--ink-2)}
.tbtn:hover{background:var(--surface-2);color:var(--ink)}

.body{display:flex;flex:1;min-height:0}
.rail{width:186px;flex:none;background:var(--surface);border-right:1px solid var(--border);padding:8px 0;overflow-y:auto}
.rail .grp{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);padding:12px 16px 6px}
.navitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:0;border-left:3px solid transparent;padding:7px 14px 7px 13px;cursor:pointer;color:var(--ink-2)}
.navitem:hover{background:var(--surface-2);color:var(--ink)}
.navitem.on{background:var(--azure-soft);border-left-color:var(--azure);color:var(--ink);font-weight:600}
/* every inline icon must be sized here â€” an unsized <svg> expands to fill its box */
.ico{width:16px;height:16px;flex:none;opacity:.85}
.ci{width:13px;height:13px;flex:none}
svg{max-width:100%}
.navitem .cnt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-3);background:var(--surface-2);border-radius:9px;padding:0 6px}
.navitem.on .cnt{background:var(--surface)}
.navgrp{display:flex;align-items:center;gap:10px;padding:11px 14px 4px 13px;font-size:12px;font-weight:700;color:var(--ink-3);letter-spacing:.01em;border-left:3px solid transparent}
.navgrp.on{color:var(--ink)}
.navgrp.on .ico{color:var(--azure);opacity:1}
.navitem.navsub{padding:5px 14px 5px 39px;font-size:12.5px}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.work{flex:1;overflow:auto;padding:18px 22px 26px}
.lab{width:330px;flex:none;background:var(--surface);border-left:1px solid var(--border);overflow-y:auto}

/* ---------- generic ---------- */
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.015em}
.h-title{font-size:19px;font-weight:600}
.h-sub{color:var(--ink-2);font-size:13px;margin-top:3px;max-width:64ch}
.head{margin-bottom:16px}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:6px}
.panel-h{display:flex;align-items:center;gap:10px;padding:9px 13px;border-bottom:1px solid var(--border);font-weight:600;font-size:13px}
.panel-h .r{margin-left:auto;font-weight:400;color:var(--ink-3);font-size:12px}
.row{display:flex;align-items:center;gap:10px;padding:9px 13px;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:0}
.rows .row:hover{background:var(--surface-2)}
.stack{display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px;align-items:start}
.dim{color:var(--ink-3)}
.sm{font-size:12px}
.empty{padding:26px 16px;text-align:center;color:var(--ink-3);font-size:13px}
.empty code{font-family:var(--mono);color:var(--azure)}

.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:3px;font-weight:500;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-fail{background:var(--fail-soft);color:var(--fail)}
.p-wait{background:var(--wait-soft);color:var(--wait)}
.p-run{background:var(--run-soft);color:var(--run)}
.p-idle{background:var(--surface-2);color:var(--ink-3)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.p-run .dot{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

.btn{background:var(--azure);color:#fff;border:1px solid var(--azure);padding:5px 13px;border-radius:4px;cursor:pointer;font-size:13px;font-weight:600}
.btn:hover{background:var(--azure-ink);border-color:var(--azure-ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink-2);border-color:var(--border-strong)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:transparent;color:var(--fail);border-color:var(--fail)}
.btn.danger:hover{background:var(--fail-soft)}

/* ---------- status glyphs ---------- */
.gl{flex:none;display:block}
.gl-spin{transform-origin:50% 50%;animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:16px}
.tab{background:transparent;border:0;border-bottom:2px solid transparent;padding:8px 14px;cursor:pointer;color:var(--ink-2);font-size:13px;margin-bottom:-1px}
.tab:hover{color:var(--ink);background:var(--surface-2)}
.tab.on{color:var(--azure);border-bottom-color:var(--azure);font-weight:600}
.fld{font-family:var(--ui);font-size:13px;padding:5px 9px;border:1px solid var(--border-strong);border-radius:4px;background:var(--surface);color:var(--ink)}
.fld:focus{outline:2px solid var(--azure);outline-offset:-1px;border-color:var(--azure)}
.fld::placeholder{color:var(--ink-3)}
select.fld{cursor:pointer}
.cmdline{background:var(--surface-2);border:1px solid var(--border);border-radius:4px;padding:7px 10px;font-size:12px;overflow-x:auto;white-space:nowrap}
.stepno{width:19px;height:19px;flex:none;border-radius:50%;background:var(--azure);color:#fff;display:grid;place-items:center;font-size:10.5px;font-weight:700;margin-top:1px}
.thread{padding:11px 13px;border-bottom:1px solid var(--border)}
.thread:last-child{border-bottom:0}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,16,26,.5);display:grid;place-items:center;z-index:60;padding:18px}
.modal{background:var(--surface);border:1px solid var(--border-strong);border-radius:8px;box-shadow:0 18px 50px rgba(10,20,40,.3);width:min(460px,100%);max-height:86vh;display:flex;flex-direction:column}
.modal-h{display:flex;align-items:center;gap:9px;padding:12px 15px;border-bottom:1px solid var(--border);font-weight:600;font-size:14px}
.modal-b{padding:15px;overflow-y:auto}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 15px;border-top:1px solid var(--border)}
.daybtn{background:var(--azure);color:#fff;border:1px solid var(--azure);padding:4px 11px;border-radius:4px;cursor:pointer;font-size:12.5px;font-weight:600}
.daybtn:hover{background:var(--azure-ink)}
.behind-warn{background:var(--wait-soft);border:1px solid var(--wait);border-radius:5px;padding:10px 13px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* ---------- file explorer ---------- */
.fx{display:grid;grid-template-columns:minmax(230px,300px) 1fr;min-height:340px}
.fx-tree{border-right:1px solid var(--border);overflow:auto;padding:5px 0}
.fx-row{display:flex;align-items:center;gap:7px;width:100%;text-align:left;background:transparent;border:0;padding:3px 12px;cursor:pointer;font-family:var(--mono);font-size:12px;color:var(--ink-2);white-space:nowrap}
.fx-row:hover{background:var(--surface-2);color:var(--ink)}
.fx-row.on{background:var(--azure-soft);color:var(--ink);font-weight:600}
.fx-row .ci{width:13px;height:13px;flex:none;opacity:.75}
.fx-row .cx{width:9px;flex:none;color:var(--ink-3);font-size:9px}
.fx-pane{display:flex;flex-direction:column;min-width:0}
.fx-head{display:flex;align-items:center;gap:9px;padding:8px 13px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.fx-head .fn{font-family:var(--mono);font-size:12.5px;font-weight:600}
.fx-body{flex:1;overflow:auto;background:var(--surface-2)}
.fx-body pre{margin:0;padding:11px 0;font-family:var(--mono);font-size:11.5px;line-height:1.65}
.cl{display:flex;gap:0}
.cl .n{flex:none;width:42px;text-align:right;padding-right:13px;color:var(--ink-3);user-select:none;font-variant-numeric:tabular-nums}
.cl .c{white-space:pre;padding-right:16px}
.k1{color:#0B5FBF}.k2{color:#A3195B}.k3{color:#0F7A4D}.k4{color:#8250DF}
:root:not([data-theme="light"]) .k1{color:#79C0FF}
:root:not([data-theme="light"]) .k2{color:#FF7B9C}
:root:not([data-theme="light"]) .k3{color:#7EE787}
:root:not([data-theme="light"]) .k4{color:#D2A8FF}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .k1{color:#0B5FBF}}
:root[data-theme="dark"] .k1{color:#79C0FF}
:root[data-theme="dark"] .k2{color:#FF7B9C}
:root[data-theme="dark"] .k3{color:#7EE787}
:root[data-theme="dark"] .k4{color:#D2A8FF}
.lastc{margin-left:auto;font-size:11.5px;color:var(--ink-3);font-family:var(--mono)}

/* ---------- dashboard ---------- */
.wgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;align-items:stretch}
.w{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:13px 15px;display:flex;flex-direction:column;gap:9px}
.w-k{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.w-big{display:flex;align-items:baseline;gap:8px}
.w-n{font-size:30px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.w-u{font-size:12px;color:var(--ink-3)}
.w-f{font-size:12px;color:var(--ink-2);margin-top:auto}
.w.span2{grid-column:span 2}
@media (max-width:760px){.w.span2{grid-column:span 1}}
.spark{display:flex;align-items:flex-end;gap:3px;height:34px}
.spark i{flex:1;border-radius:1px;min-height:3px;background:var(--border-strong)}
.spark i.ok{background:var(--ok)}
.spark i.no{background:var(--fail)}
.minirow{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:4px 0;border-bottom:1px solid var(--border)}
.minirow:last-child{border-bottom:0}

/* ---------- repo switcher ---------- */
.repobar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:9px 12px}
.repochip{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--border);border-radius:14px;padding:3px 11px;cursor:pointer;font-size:12px;font-family:var(--mono);color:var(--ink-2)}
.repochip:hover{border-color:var(--border-strong);color:var(--ink);background:var(--surface-2)}
.repochip.on{background:var(--azure);border-color:var(--azure);color:#fff;font-weight:600}
.projsel{display:flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--border);border-radius:4px;padding:3px 9px;cursor:pointer;font-size:12.5px;color:var(--ink-2)}
.projsel:hover{background:var(--surface-2);color:var(--ink)}
.projsel b{color:var(--ink);font-weight:600}

/* ---------- repo ---------- */
.branchline{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:12.5px}
.sha{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);background:var(--surface-2);padding:1px 5px;border-radius:3px}
.ahead{font-family:var(--mono);font-size:11px;color:var(--wait)}
.policybox{background:var(--surface-2);border:1px dashed var(--border-strong);border-radius:5px;padding:11px 13px}
.policybox ul{margin:7px 0 0;padding-left:17px;font-size:12.5px;color:var(--ink-2)}
.policybox li{margin:3px 0}
.filerow{display:flex;align-items:center;gap:9px;padding:5px 13px;font-family:var(--mono);font-size:12px;border-bottom:1px solid var(--border)}
.filerow:last-child{border-bottom:0}
.tag-m{color:var(--wait);font-weight:700}
.tag-a{color:var(--ok);font-weight:700}
.tag-u{color:var(--fail);font-weight:700}
.graph{font-family:var(--mono);font-size:12px;line-height:1.75;padding:11px 13px;overflow-x:auto}
.graph .g{color:var(--azure)}

/* ---------- pipeline ---------- */
.stagestrip{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:13px;gap:8px}
.stage{min-width:172px;border:1px solid var(--border);border-radius:5px;background:var(--surface);padding:10px 11px;flex:none;position:relative}
.stage.act{border-color:var(--azure);box-shadow:0 0 0 2px var(--azure-soft)}
.stage-n{font-weight:600;font-size:12.5px;display:flex;align-items:center;gap:7px;margin-bottom:7px}
.stage-j{font-family:var(--mono);font-size:11px;color:var(--ink-3);display:flex;align-items:center;gap:6px;padding:2px 0}
.arrow{align-self:center;color:var(--border-strong);flex:none;font-size:15px}
.gatebar{display:flex;align-items:center;gap:12px;padding:11px 13px;background:var(--wait-soft);border:1px solid var(--wait);border-radius:5px;margin-bottom:14px;flex-wrap:wrap}
.gatebar .txt{flex:1;min-width:200px;font-size:13px;color:var(--ink)}
.gatebar b{color:var(--wait)}
.steplist{border-top:1px solid var(--border)}
.step{border-bottom:1px solid var(--border)}
.step-h{display:flex;align-items:center;gap:9px;padding:7px 13px;cursor:pointer;background:transparent;border:0;width:100%;text-align:left}
.step-h:hover{background:var(--surface-2)}
.step-h .nm{font-size:12.5px}
.step-h .dur{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.logs{background:var(--term-bg);color:var(--term-ink);font-family:var(--mono);font-size:11.5px;line-height:1.6;padding:9px 13px;overflow-x:auto;max-height:230px;overflow-y:auto}
.logs .ln{white-space:pre;display:flex;gap:12px}
.logs .no{color:var(--term-dim);flex:none;user-select:none;min-width:22px;text-align:right}
.logs .er{color:var(--term-red)}
.logs .wr{color:var(--term-yellow)}
.logs .gd{color:var(--term-green)}

/* ---------- PR ---------- */
.checkrow{display:flex;align-items:center;gap:9px;padding:7px 13px;border-bottom:1px solid var(--border);font-size:12.5px}
.checkrow:last-child{border-bottom:0}
.checkrow .ck{width:15px;flex:none;font-weight:700;text-align:center}
.ck-ok{color:var(--ok)}.ck-no{color:var(--fail)}.ck-wt{color:var(--wait)}
.avatar{width:22px;height:22px;border-radius:50%;background:var(--azure);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:700;flex:none}

/* ---------- terminal ---------- */
.term{flex:none;background:var(--term-bg);border-top:1px solid var(--border);display:flex;flex-direction:column;position:relative}
.term-grip{height:7px;flex:none;cursor:ns-resize;background:transparent;position:relative;touch-action:none}
.term-grip::after{content:"";position:absolute;left:50%;top:2px;transform:translateX(-50%);width:38px;height:3px;border-radius:2px;background:var(--border-strong);opacity:.5;transition:opacity .12s,background .12s}
.term-grip:hover::after,.term-grip.drag::after{opacity:1;background:var(--azure)}
body.resizing{cursor:ns-resize;user-select:none}
.term-h{display:flex;align-items:center;gap:9px;padding:0 12px;height:34px;flex:none;border-bottom:1px solid rgba(255,255,255,.07)}
.term-h .t{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--term-dim)}
.term-h .sp{flex:1}
.tbtn2{background:transparent;border:1px solid rgba(255,255,255,.14);color:var(--term-dim);padding:2px 9px;border-radius:3px;cursor:pointer;font-size:11px;font-family:var(--mono)}
.tbtn2:hover{color:var(--term-ink);border-color:rgba(255,255,255,.3)}
.term-o{flex:1;overflow-y:auto;padding:9px 12px;font-family:var(--mono);font-size:12px;line-height:1.62;color:var(--term-ink)}
.term-o .l{white-space:pre-wrap;word-break:break-word}
.t-cmd{color:#fff}
.t-cmd .ps{color:var(--term-green)}
.t-err{color:var(--term-red)}
.t-ok{color:var(--term-green)}
.t-warn{color:var(--term-yellow)}
.t-info{color:var(--term-blue)}
.t-dim{color:var(--term-dim)}
.term-i{display:flex;align-items:center;gap:8px;padding:6px 12px 9px;flex:none}
.term-i .ps{color:var(--term-green);font-family:var(--mono);font-size:12px;flex:none}
.term-i input{flex:1;background:transparent;border:0;outline:0;color:#fff;font-family:var(--mono);font-size:12px;padding:2px 0}

/* ---------- lab panel ---------- */
.lab-h{padding:14px 16px;border-bottom:1px solid var(--border)}
.lab-k{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--azure);font-weight:700}
.lab-t{font-size:16px;font-weight:600;margin-top:5px}
.lab-b{padding:14px 16px;border-bottom:1px solid var(--border);font-size:13px;color:var(--ink-2)}
.lab-b p{margin:0 0 9px}
.lab-b p:last-child{margin:0}

/* ---------- derived helpers ---------- */
function headSha(s){ return s.repo.branches[s.repo.head]; }
function log(s, branch){
  var out=[], cur=s.repo.branches[branch||s.repo.head];
  while(cur){ var c=s.repo.commits[cur]; if(!c) break; out.push(c); cur=c.parent; }
  return out;
}
function ahead(s, branch){
  var local=s.repo.branches[branch], rem=s.repo.remote[branch];
  if(local===rem) return 0;
  var n=0, cur=local;
  while(cur && cur!==rem){ n++; cur=(s.repo.commits[cur]||{}).parent; }
  return n;
}
function dirty(s){ return Object.keys(s.repo.workdir).length>0 || Object.keys(s.repo.index).length>0; }
/* how many commits the SERVER has that your laptop doesn't */
function behind(s, branch){
  var local=s.repo.branches[branch], rem=s.repo.remote[branch];
  if(local===rem || rem===undefined) return 0;
  var n=0, cur=rem;
  while(cur && cur!==local){ n++; cur=(s.repo.commits[cur]||{}).parent; }
  return cur===local ? n : 0;
}
function unresolved(s){
  return s.prs.reduce(function(n,p){
    return n + (p.threads||[]).filter(function(t){return !t.resolved;}).length;
  },0);
}
function openPRs(s){ return s.prs.filter(function(p){return p.status==="active";}); }
function buildBroken(s, branch){
  // a commit on this branch touched a file marked broken
  var cs = log(s, branch);
  for(var i=0;i<cs.length;i++){
    for(var j=0;j<(cs[i].files||[]).length;j++){
      if(cs[i].broken) return true;
    }
  }
  return false;
}

        "git checkout --progress --force "+commitSha,
        "HEAD is now at "+commitSha+" "+msg ]},
      { name:"Maven: package", ticks:4, status:"pending",
        fails: broken,
        logs: broken ? [
          "[INFO] Scanning for projects...",
          "[INFO] Building taskapi 0.0.1-SNAPSHOT",
          "[INFO] --- maven-compiler-plugin:3.13.0:compile (default-compile) ---",
          "!ERR [ERROR] TaskController.java:[18,9] cannot find symbol",
          "!ERR [ERROR]   symbol:   method listAll()",
          "!ERR [ERROR] BUILD FAILURE",

          "[INFO] Scanning for projects...",

          "[INFO] --- maven-compiler-plugin:3.13.0:compile (default-compile) ---",
          "[INFO] --- maven-surefire-plugin:3.2.5:test ---",
          "[INFO] Tests run: 4, Failures: 0, Errors: 0, Skipped: 0",
          "!OK [INFO] BUILD SUCCESS" ]},
      { name:"Publish artifact: drop", ticks:2, status:"pending", logs:[
        "Uploading target/taskapi-0.0.1-SNAPSHOT.jar (24.8 MB)",
        "!OK Artifact 'drop' published. This exact jar is what every environment gets." ]}
    ]}]
  }];
}

function cdStages(){
  return [
    { name:"Deploy_Dev", env:"dev", status:"pending",
      jobs:[{ name:"DeployJob", pool:"ubuntu-latest", status:"pending", steps:[
        { name:"Download artifact: drop", ticks:2, status:"pending", logs:[
          "Downloading artifact 'drop' from run",
          "!OK No rebuild. Same jar the Build stage produced." ]},
        { name:"Azure App Service deploy: taskapi-dev", ticks:3, status:"pending", logs:[
          "Deploying package to App Service 'taskapi-dev'",
          "Restarting app...",
          "!OK App Service application URL: https://taskapi-dev.azurewebsites.net" ]}
      ]}]},
    { name:"Deploy_Prod", env:"prod", status:"pending",
      jobs:[{ name:"DeployJob", pool:"ubuntu-latest", status:"pending", steps:[
        { name:"Download artifact: drop", ticks:2, status:"pending", logs:[
          "Downloading artifact 'drop' from run",
          "!OK Byte-for-byte the jar that passed dev." ]},
        { name:"Azure App Service deploy: taskapi-prod", ticks:3, status:"pending", logs:[
          "Deploying package to App Service 'taskapi-prod'",
          "!OK App Service application URL: https://taskapi.azurewebsites.net" ]}
      ]}]}
  ];
}

function newRun(s, opts){
  var c = s.repo.commits[opts.commit] || {};
  var st = ciStages(opts.commit, c.msg||"", !!c.broken);
  if(opts.cd) st = st.concat(cdStages());
  return {
    id: s.nextRun, name: opts.name || "taskapi CI",
    trigger: opts.trigger, branch: opts.branch, commit: opts.commit,
    commitMsg: c.msg || "", prId: opts.prId || null,
    status:"running", stages: st, cursor:{st:0,jb:0,sp:0}, tick:0, elapsed:0
  };
}

/* advance every running run by one tick; returns [runs, events] */
function advance(state){
  var events=[];
  var runs = state.runs.map(function(r){
    if(r.status!=="running") return r;
    r = JSON.parse(JSON.stringify(r));
    r.elapsed++;
    var c=r.cursor, stage=r.stages[c.st];
    if(!stage){ r.status="succeeded"; return r; }

    // entering a gated stage that has not been approved yet
    if(stage.status==="pending" && stage.env && state.envs[stage.env] && state.envs[stage.env].gated && !stage.approved){
      stage.status="waiting"; r.status="waiting";
      events.push({type:"gate", runId:r.id, stageIdx:c.st, env:stage.env});
      return r;
    }
    if(stage.status==="pending") stage.status="running";
    var job=stage.jobs[c.jb];
    if(job.status==="pending") job.status="running";
    var step=job.steps[c.sp];
    if(step.status==="pending"){ step.status="running"; step.shown=0; }

    step.shown = Math.min((step.shown||0)+Math.ceil(step.logs.length/step.ticks), step.logs.length);
    step.tick=(step.tick||0)+1;

    if(step.tick>=step.ticks){
      step.shown=step.logs.length;
      step.duration=(step.ticks*0.7).toFixed(1)+"s";
      if(step.fails){
        step.status="failed"; job.status="failed"; stage.status="failed"; r.status="failed";
        events.push({type:"failed", runId:r.id, prId:r.prId});
        return r;
      }
      step.status="succeeded";
      c.sp++;
      if(c.sp>=job.steps.length){
        job.status="succeeded"; c.sp=0; c.jb++;
        if(c.jb>=stage.jobs.length){
          stage.status="succeeded"; c.jb=0; c.st++;
          events.push({type:"stagedone", runId:r.id, stage:stage.name, env:stage.env});
          if(c.st>=r.stages.length){
            r.status="succeeded";
            events.push({type:"done", runId:r.id, prId:r.prId});
          }
        }
      }
    }
    return r;
  });
  return [runs, events];
}

var HELP = [
  ["git status",                    "what's changed in the working tree"],
  ["git log [--oneline]",           "commit history of the current branch"],
  ["git branch",                    "list branches"],
  ["git checkout -b <name>",        "create a branch and switch to it"],
  ["git checkout <name>",           "switch branches"],
  ["git add . | <file>",            "stage changes"],
  ["git commit -m \"msg\"",           "commit what's staged"],
  ["git push [-u origin <br>]",     "push the current branch to Azure Repos"],
  ["git merge <branch>",            "merge a branch into the current one"],
  ["git remote -v",                 "show where 'origin' points"],
  ["edit <file> [--bug]",           "modify a file (--bug plants a compile error)"],
  ["fix <file>",                    "repair a file you broke"],
  ["az repos list",                 "list the repositories in this project"],
  ["az repos select <name>",        "point the terminal at a different repo"],
  ["az boards work-item create --title \"t\"", "create a work item on the board"],
  ["az repos pr create --title \"t\" [--work-item 42]", "open a pull request"],
  ["az pipelines run [--cd]",       "queue a pipeline manually (--cd adds deploy stages)"],
  ["clear",                         "clear the terminal"],
  ["reset",                         "wipe the sandbox back to Step 0"]
];

function tokenize(line){
  var out=[], re=/"([^"]*)"|'([^']*)'|(\S+)/g, m;
  while((m=re.exec(line))) out.push(m[1]!==undefined?m[1]:(m[2]!==undefined?m[2]:m[3]));
  return out;
}
function flagVal(a,name){ var i=a.indexOf(name); return i>=0 ? a[i+1] : null; }

/* Each handler returns {state, out:[{k,t}]} */
function runCommand(s, line){
  var out=[], a=tokenize(line.trim());
  if(!a.length) return {state:s, out:out};
  var st = JSON.parse(JSON.stringify(s));
  var say=function(k,t){ out.push({k:k,t:t}); };
  var F=st.flags;

  function notFound(){ say("err","'"+a[0]+"' is not recognized. Type 'help' for the command list."); }

  /* ---- help / misc ---- */
  if(a[0]==="help"){
    say("info","Commands available in this sandbox:");
    HELP.forEach(function(h){ say("dim","  "+h[0]+new Array(Math.max(2,44-h[0].length)).join(" ")+h[1]); });
    return {state:st,out:out};
  }
  if(a[0]==="clear"){ st.term=[]; return {state:st,out:[]}; }
  if(a[0]==="reset"){ var f=initial(); f.term=[{k:"warn",t:"Sandbox reset to Step 0."}]; return {state:f,out:[]}; }

  /* ---- edit / fix ---- */
  if(a[0]==="ls"||a[0]==="dir"){
    say("info","Files in "+st.activeRepo+" (copy one of these):");
    (st.repo.tracked||[]).forEach(function(p){ say("plain","  "+p); });
    say("dim","Edit one with:  edit <path>     â€” or click it in Files above and press Edit.");
    st.view="files";
    return {state:st,out:out};
  }
  if(a[0]==="edit"||a[0]==="touch"){
    var p=a[1];
    if(!p){
      say("err","usage: edit <file>");
      say("info","Files you can edit in "+st.activeRepo+":");
      (st.repo.tracked||[]).forEach(function(f){ say("plain","  edit "+f); });
      say("dim","Or skip the terminal: open Files, click a file, press Edit.");
      st.view="files";
      return {state:st,out:out};
    }
    var known = FILES.indexOf(p)>=0;
    st.repo.workdir[p]= known ? "modified" : "untracked";
    st.view="files"; st.openFile=p;
    if(a.indexOf("--bug")>=0){ st.repo.broken[p]=true; say("warn","Planted a compile error in "+p+". The next build will fail â€” that's the point."); }
    else say("ok",(known?"Modified ":"Created ")+p);
    say("dim","Look at Files above â€” it's marked "+(known?"modified":"new")+", and it exists only on your laptop.");
    F.edited=true;
    return {state:st,out:out};
  }
  if(a[0]==="fix"){
    var fp=a[1];
    if(!fp||!st.repo.broken[fp]){ say("err","Nothing broken at "+(fp||"<file>")); return {state:st,out:out}; }
    delete st.repo.broken[fp];
    st.repo.workdir[fp]="modified";
    say("ok","Repaired "+fp+". Commit and push it to re-trigger validation.");
    F.fixed=true;
    return {state:st,out:out};
  }

  /* ---- git ---- */
  if(a[0]==="git"){
    var sub=a[1];

    if(sub==="status"){
      F.ranStatus=true;
      say("plain","On branch "+st.repo.head);
      var ah=ahead(st, st.repo.head);
      if(st.repo.remote[st.repo.head]===undefined) say("warn","No upstream branch. Use: git push -u origin "+st.repo.head);
      else if(ah>0) say("plain","Your branch is ahead of 'origin/"+st.repo.head+"' by "+ah+" commit"+(ah>1?"s":"")+".");
      else say("plain","Your branch is up to date with 'origin/"+st.repo.head+"'.");
      var idx=Object.keys(st.repo.index), wd=Object.keys(st.repo.workdir);
      if(idx.length){ say("plain",""); say("plain","Changes to be committed:"); idx.forEach(function(p){ say("ok","        "+st.repo.index[p]+":   "+p); }); }
      if(wd.length){ say("plain",""); say("plain","Changes not staged for commit:"); wd.forEach(function(p){ say("err","        "+st.repo.workdir[p]+":   "+p); }); }
      if(!idx.length && !wd.length) say("plain","nothing to commit, working tree clean");
      return {state:st,out:out};
    }

    if(sub==="log"){
      F.ranLog=true;
      var cs=log(st);
      if(a.indexOf("--oneline")>=0) cs.forEach(function(c){ say("plain", c.sha+" "+c.msg); });
      else cs.forEach(function(c){ say("warn","commit "+c.sha); say("plain","Author: "+c.author); say("plain",""); say("plain","    "+c.msg); say("plain",""); });
      return {state:st,out:out};
    }

    if(sub==="branch"){
      Object.keys(st.repo.branches).forEach(function(b){ say(b===st.repo.head?"ok":"plain",(b===st.repo.head?"* ":"  ")+b); });
      return {state:st,out:out};
    }

    if(sub==="remote"){
      F.ranRemote=true;
      say("plain","origin  "+ORG+" (fetch)");
      say("plain","origin  "+ORG+" (push)");
      say("dim","This URL is the ONLY thing that would differ if you hosted on GitHub instead.");
      return {state:st,out:out};
    }

    if(sub==="checkout"||sub==="switch"){
      var mk = a.indexOf("-b")>=0 || a.indexOf("-c")>=0;
      var name = a[a.length-1];
      if(mk){
        if(st.repo.branches[name]){ say("err","fatal: a branch named '"+name+"' already exists"); return {state:st,out:out}; }
        st.repo.branches[name]=st.repo.branches[st.repo.head];
        st.repo.head=name;
        say("ok","Switched to a new branch '"+name+"'");
        F.createdBranch=true;
        if(/^(feature|bugfix|hotfix|users)\//.test(name)) F.namedWell=true;
      } else {
        if(!st.repo.branches[name]){ say("err","error: pathspec '"+name+"' did not match any known branch"); return {state:st,out:out}; }
        st.repo.head=name;
        say("plain","Switched to branch '"+name+"'");
      }
      return {state:st,out:out};
    }

    if(sub==="add"){
      var target=a[2];
      if(!target){ say("err","Nothing specified, nothing added."); return {state:st,out:out}; }
      var keys=Object.keys(st.repo.workdir);
      if(!keys.length){ say("dim","No changes to stage."); return {state:st,out:out}; }
      if(target==="."||target==="-A"||target==="*"){
        keys.forEach(function(p){ st.repo.index[p]=st.repo.workdir[p]; delete st.repo.workdir[p]; });
        say("ok","Staged "+keys.length+" file"+(keys.length>1?"s":"")+".");
      } else if(st.repo.workdir[target]){
        st.repo.index[target]=st.repo.workdir[target]; delete st.repo.workdir[target];
        say("ok","Staged "+target);
      } else say("err","pathspec '"+target+"' did not match any files");
      st.view="files";
      F.staged=true;
      return {state:st,out:out};
    }

    if(sub==="commit"){
      var msg=flagVal(a,"-m")||flagVal(a,"--message");
      var staged=Object.keys(st.repo.index);
      if(!msg){ say("err","Aborting commit: use  git commit -m \"your message\""); return {state:st,out:out}; }
      if(!staged.length){ say("err","nothing to commit â€” stage something first with: git add ."); return {state:st,out:out}; }
      var id=sha();
      var isBroken = staged.some(function(p){ return st.repo.broken[p]; });
      st.repo.commits[id]={sha:id,msg:msg,parent:st.repo.branches[st.repo.head],author:USER,branch:st.repo.head,files:staged,broken:isBroken};
      st.repo.branches[st.repo.head]=id;
      staged.forEach(function(p){ if(st.repo.tracked.indexOf(p)<0) st.repo.tracked.push(p); });
      st.repo.index={};
      st.view="commits";
      say("plain","["+st.repo.head+" "+id+"] "+msg);
      say("dim"," "+staged.length+" file"+(staged.length>1?"s":"")+" changed");
      F.committed=true;
      // pushing a new commit to a PR branch resets votes + re-runs validation
      var pr=st.prs.filter(function(p){return p.status==="active"&&p.source===st.repo.head;})[0];
      if(pr) say("dim","Branch "+st.repo.head+" has an open PR â€” push to re-trigger its build validation.");
      return {state:st,out:out};
    }

    if(sub==="push"){
      var br=st.repo.head;
      var isProtected = (br==="main" && st.policy.requirePR);
      if(isProtected){
        say("plain","Enumerating objects: 5, done.");
        say("err","remote: TF402455: Pushes to this branch are not permitted; you must use a pull request to update this branch.");
        say("err","To "+ORG);
        say("err"," ! [remote rejected]   main -> main (pre-receive hook declined)");
        say("err","error: failed to push some refs to '"+ORG+"'");
        say("dim","");
        say("info","That is a BRANCH POLICY, enforced server-side. Your local git is fine â€” the server said no.");
        say("info","Make a branch instead:  git checkout -b feature/tasks-endpoint");
        st.pushes.unshift({branch:br,n:ahead(st,br)||1,sha:st.repo.branches[br],rejected:true});
        st.view="branches";
        F.pushRejected=true;
        return {state:st,out:out};
      }
      var n=ahead(st,br);
      if(st.repo.remote[br]!==undefined && n===0){ say("dim","Everything up-to-date"); return {state:st,out:out}; }
      var fresh = st.repo.remote[br]===undefined;
      st.repo.remote[br]=st.repo.branches[br];
      say("plain","Enumerating objects: "+(n*3+2)+", done.");
      say("plain","To "+ORG);
      say("ok"," * ["+(fresh?"new branch":"updated")+"]      "+br+" -> "+br);
      say("dim","Your files are on the server now. The banner in Files above just flipped to 'in sync'.");
      st.pushes.unshift({branch:br,n:n||1,sha:st.repo.branches[br],rejected:false});
      st.view="files";
      F.pushedBranch=true;
      if(fresh) say("info","remote: Create a pull request for '"+br+"':  az repos pr create --title \"...\"");
      // re-trigger PR validation build
      var pr2=st.prs.filter(function(p){return p.status==="active"&&p.source===br;})[0];
      if(pr2){
        pr2.reviewers.forEach(function(rv){ rv.vote=0; });
        pr2.buildRunId=st.nextRun;
        st.runs.unshift(newRun(st,{commit:st.repo.branches[br],branch:br,trigger:"PR validation for !"+pr2.id,name:"taskapi CI (PR validation)",prId:pr2.id}));
        st.nextRun++;
        say("info","Build validation re-queued for PR !"+pr2.id+"; reviewer votes were reset.");
      }
      return {state:st,out:out};
    }

    if(sub==="merge"){
      var src=a[2];
      if(!st.repo.branches[src]){ say("err","merge: "+src+" - not something we can merge"); return {state:st,out:out}; }
      say("warn","This sandbox wants you to merge through a pull request, the way the policy requires.");
      say("info","Try:  az repos pr create --title \"Add tasks endpoint\" --work-item 42");
      return {state:st,out:out};
    }

    if(sub==="pull"||sub==="fetch"){
      var b2=st.repo.head, n2=behind(st,b2);
      if(!n2){ say("plain","Already up to date."); return {state:st,out:out}; }
      var from=st.repo.branches[b2];
      var incoming=[], cur2=st.repo.remote[b2];
      while(cur2 && cur2!==from){ incoming.push(st.repo.commits[cur2]); cur2=(st.repo.commits[cur2]||{}).parent; }
      say("plain","remote: Enumerating objects: "+(n2*3)+", done.");
      say("plain","From "+ORG);
      say("plain","   "+String(from).slice(0,7)+".."+String(st.repo.remote[b2]).slice(0,7)+"  "+b2+" -> origin/"+b2);
      if(sub==="fetch"){ say("dim","Fetched, but not merged. 'git pull' = fetch + merge."); return {state:st,out:out}; }
      st.repo.branches[b2]=st.repo.remote[b2];
      say("ok","Updating "+String(from).slice(0,7)+".."+String(st.repo.branches[b2]).slice(0,7));
      say("ok","Fast-forward");
      incoming.reverse().forEach(function(c){ say("plain","   "+c.sha+"  "+c.msg+"   ("+c.author+")"); });
      say("dim","That's other people's work arriving on your machine. Do this before you start anything.");
      st.flags.pulled=true; st.view="commits";
      return {state:st,out:out};
    }
    say("err","git: '"+sub+"' is not supported in this sandbox. Type 'help'.");
    return {state:st,out:out};
  }

  /* ---- az cli ---- */
  if(a[0]==="az"){
    if(a[1]==="repos"&&a[2]==="pr"&&a[3]==="create"){
      var title=flagVal(a,"--title")||flagVal(a,"-t");
      var wi=flagVal(a,"--work-item")||flagVal(a,"-w");
      var srcb=st.repo.head;
      if(srcb==="main"){ say("err","A pull request needs a source branch other than 'main'."); return {state:st,out:out}; }
      if(st.repo.remote[srcb]===undefined){ say("err","Branch '"+srcb+"' does not exist on the server yet. Run:  git push -u origin "+srcb); return {state:st,out:out}; }
      if(!title){ say("err","usage: az repos pr create --title \"your title\" [--work-item 42]"); return {state:st,out:out}; }
      if(st.prs.some(function(p){return p.status==="active"&&p.source===srcb;})){ say("err","An active pull request already exists for '"+srcb+"'."); return {state:st,out:out}; }
      var pr={
        id:st.nextPr, title:title, source:srcb, target:"main", status:"active",
        author:USER, workItem: wi?parseInt(wi,10):null,
        reviewers:[{name:"Priya Raman",initials:"PR",vote:0,required:true}],
        buildRunId:st.nextRun, threads:[]
      };
      st.prs.unshift(pr);
      st.runs.unshift(newRun(st,{commit:st.repo.branches[srcb],branch:srcb,trigger:"PR validation for !"+pr.id,name:"taskapi CI (PR validation)",prId:pr.id}));
      st.nextPr++; st.nextRun++;
      st.view="prs"; st.openPr=pr.id;
      say("ok","Pull request !"+pr.id+" created: "+srcb+" -> main");
      say("info","Branch policy queued a validation build automatically. Watch it in Pipelines.");
      if(!wi) say("warn","No work item linked. The policy requires one â€” link it in the PR view.");
      F.openedPR=true;
      return {state:st,out:out};
    }
    if(a[1]==="repos"&&a[2]==="list"){
      say("info","Repositories in project '"+st.project+"':");
      Object.keys(REPO_META).forEach(function(n){
        say(n===st.activeRepo?"ok":"plain","  "+(n===st.activeRepo?"* ":"  ")+n+new Array(Math.max(2,20-n.length)).join(" ")+REPO_META[n].lang+"  "+REPO_META[n].desc);
      });
      st.view="repolist";
      return {state:st,out:out};
    }
    if(a[1]==="repos"&&a[2]==="select"){
      var rn=a[3];
      if(!REPO_META[rn]){ say("err","No repository named '"+(rn||"")+"'. Try:  az repos list"); return {state:st,out:out}; }
      if(rn===st.activeRepo){ say("dim","Already on '"+rn+"'."); return {state:st,out:out}; }
      st.repoStore[st.activeRepo]=st.repo;
      st.repo=st.repoStore[rn];
      delete st.repoStore[rn];
      st.activeRepo=rn;
      st.openFile=(st.repo.tracked||[])[0];
      st.view="files";
      say("ok","Switched to repository '"+rn+"'.");
      say("dim","git status, git log and everything else now operate on this repo.");
      return {state:st,out:out};
    }
    if(a[1]==="boards"&&a[2]==="work-item"&&a[3]==="create"){
      var wt=flagVal(a,"--title")||flagVal(a,"-t");
      var wtype=flagVal(a,"--type")||"User Story";
      if(!wt){ say("err","usage: az boards work-item create --title \"...\" [--type Bug|Task]"); return {state:st,out:out}; }
      st.workItems.push({id:st.nextWi,type:wtype,title:wt,state:"New",pts:3,who:"unassigned",pri:2});
      say("ok","Created work item #"+st.nextWi+" â€” "+wt);
      say("dim","It's on the board now. Link it to a PR later with --work-item "+st.nextWi);
      st.nextWi++; st.view="witems"; F.madeWi=true;
      return {state:st,out:out};
    }
    if(a[1]==="pipelines"&&a[2]==="run"){
      var cd=a.indexOf("--cd")>=0;
      st.runs.unshift(newRun(st,{commit:headSha(st),branch:st.repo.head,trigger:"Manually queued by "+USER,name:cd?"taskapi CI/CD":"taskapi CI",cd:cd}));
      st.nextRun++; st.view="pipelines"; st.openRun=st.nextRun-1;
      say("ok","Queued run #"+(st.nextRun-1)+" on "+st.repo.head+(cd?" (with deploy stages)":""));
      F.ranPipeline=true;
      return {state:st,out:out};
    }
    say("err","az: unsupported command in this sandbox. Type 'help'.");
    return {state:st,out:out};
  }

  notFound();
  return {state:st,out:out};
}

function glyph(status, size){
  var d = size || 15;
  var map = {
    succeeded:["var(--ok)",  "M4.5 8.2l2.4 2.4 4.6-5"],
    completed:["var(--ok)",  "M4.5 8.2l2.4 2.4 4.6-5"],
    failed:   ["var(--fail)","M5.4 5.4l5.2 5.2M10.6 5.4l-5.2 5.2"],
    waiting:  ["var(--wait)","M6.4 5.4v5.2M9.6 5.4v5.2"],
    running:  ["var(--run)", null],
    active:   ["var(--run)", null],
    pending:  ["var(--ink-3)",null]
  };
  var m = map[status] || map.pending;
  if(status==="running"||status==="active"){
    return html`<svg class="gl" width=${d} height=${d} viewBox="0 0 16 16" aria-label=${status}>
      <circle cx="8" cy="8" r="6.6" fill="none" stroke="var(--border-strong)" stroke-width="1.8"></circle>
      <path class="gl-spin" d="M8 1.4a6.6 6.6 0 016.6 6.6" fill="none" stroke=${m[0]} stroke-width="1.8" stroke-linecap="round"></path>
    </svg>`;
  }
  if(status==="pending"){
    return html`<svg class="gl" width=${d} height=${d} viewBox="0 0 16 16" aria-label="queued">
      <circle cx="8" cy="8" r="6.6" fill="none" stroke="var(--border-strong)" stroke-width="1.6" stroke-dasharray="2.2 2.4"></circle>
    </svg>`;
  }
  return html`<svg class="gl" width=${d} height=${d} viewBox="0 0 16 16" aria-label=${status}>
    <circle cx="8" cy="8" r="7" fill=${m[0]}></circle>
    <path d=${m[1]} fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"></path>
  </svg>`;
}

    String message,\n\
    String path\n\
) {\n\
    public static ApiError of(int status, String message, String path) {\n\
        return new ApiError(Instant.now(), status, message, path);\n\
    }\n\
}'
};

function contentFor(repo, path){
  if(arguments.length===1){ path=repo; repo="taskapi"; }
  if(repo==="taskapi" && CONTENT[path]) return CONTENT[path];
  var k = repo+":"+path;
  if(CONTENT2[k]) return CONTENT2[k];
  return "// " + path + "\n// Created in this sandbox. Nothing real behind it yet.";
}

/* crude highlighter â€” enough to make a file read like code, not a wall of grey */
function hl(line){
  var parts = line.split(/("(?:[^"\\]|\\.)*"|#[^\n]*$|\/\/[^\n]*$|<!--[\s\S]*?-->|@[A-Za-z]+|\b(?:public|private|static|final|class|void|return|import|package|new|extends|implements)\b)/g);
  return parts.map(function(t,i){
    if(!t) return null;
    var c = null;
    if(/^"/.test(t)) c="k3";
    else if(/^(#|\/\/|<!--)/.test(t)) c="dim";
    else if(/^@/.test(t)) c="k4";
    else if(/^(public|private|static|final|class|void|return|import|package|new|extends|implements)$/.test(t)) c="k2";
    else if(/^<\/?[a-zA-Z]/.test(t)) c="k1";
    return c ? html`<span class=${c} key=${i}>${t}</span>` : t;
  });
}

/* nested tree from a flat path list */
function buildTree(paths){
  var root = {};
  paths.slice().sort().forEach(function(p){
    var parts = p.split("/"), node = root;
    for(var i=0;i<parts.length;i++){
      var part = parts[i];
      if(i === parts.length-1){ node[part] = {__file:p}; }
      else { if(!node[part] || node[part].__file) node[part] = {}; node = node[part]; }
    }
  });
  return root;
}

function treeRows(node, depth, s, act, out){
  out = out || [];
  var keys = Object.keys(node).sort(function(a,b){
    var af = !!node[a].__file, bf = !!node[b].__file;
    if(af !== bf) return af ? 1 : -1;
    return a.localeCompare(b);
  });
  keys.forEach(function(k){
    var n = node[k];
    if(n.__file){
      var p = n.__file;
      var mark = s.repo.index[p] ? "staged" : (s.repo.workdir[p] || null);
      out.push(html`<button class=${"fx-row"+(s.openFile===p?" on":"")} key=${p} style=${{paddingLeft:(12+depth*13)+"px"}} onClick=${function(){act({t:"open_file",p:p});}}>
        <span class="cx"></span>
        <svg class="ci" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M9 1.5H4.5A1.5 1.5 0 003 3v10a1.5 1.5 0 001.5 1.5h7A1.5 1.5 0 0013 13V5.5zM9 1.5V5.5H13"/></svg>
        <span>${k}</span>
        ${mark ? html`<span class=${"lastc "+(mark==="staged"?"tag-a":mark==="untracked"?"tag-u":"tag-m")}>${mark==="staged"?"staged":mark==="untracked"?"new":"modified"}</span>` : null}
        ${s.repo.broken[p] ? html`<span class="lastc tag-u">breaks build</span>` : null}
      </button>`);
    } else {
      out.push(html`<div class="fx-row" key=${"d"+depth+k} style=${{paddingLeft:(12+depth*13)+"px",cursor:"default"}}>
        <span class="cx">â–¾</span>
        <svg class="ci" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M1.5 4A1.5 1.5 0 013 2.5h3l1.5 2h5A1.5 1.5 0 0114 6v6.5a1 1 0 01-1 1H2.5a1 1 0 01-1-1z"/></svg>
        <span style="color:var(--ink-2)">${k}</span>
      </div>`);
      treeRows(n, depth+1, s, act, out);
    }
  });
  return out;
}

  var buildOk = run && run.status==="succeeded";
  var buildBad = run && run.status==="failed";
  var approvals = pr.reviewers.filter(function(r){return r.vote>0;}).length;
  var open = (pr.threads||[]).filter(function(t){return !t.resolved;}).length;
  var checks=[
    {ok: buildOk, wait: !run||run.status==="running", label:"Build validation â€” taskapi CI", detail: run? ("run #"+run.id+" Â· "+run.status) : "not queued"},
    {ok: approvals>=s.policy.minReviewers, wait:false, label:"Required reviewers ("+approvals+"/"+s.policy.minReviewers+")", detail: approvals?"approved":"awaiting review"},

  return html`

    ${s.prs.length>1 ? html`<div class="panel"><div class="panel-h">All pull requests</div><div class="rows">
      ${s.prs.map(function(p){ return html`<div class="row" key=${p.id} style="cursor:pointer" onClick=${function(){act({t:"open_pr",id:p.id});}}>

      <div style="padding:0 13px 13px"><div class="panel">
        ${checks.map(function(c,i){ return html`<div class="checkrow" key=${i}>
          ${glyph(c.ok?"succeeded":c.wait?"running":"failed",15)}
          <span>${c.label}</span>
          <span class="dim sm" style="margin-left:auto">${c.detail}</span>
        </div>`; })}
      </div></div>

      <div class="row" style="gap:9px;flex-wrap:wrap">

      ${(pr.threads||[]).length ? html`<div>
        <div class="panel-h" style="border-top:1px solid var(--border)">Comment threads<span class="r num">${open} open</span></div>

        ${open? html`<div style="padding:9px 13px"><div class="sm dim">A reviewer's comment is a blocking policy here â€” <b>Complete</b> stays locked until every thread is resolved. Search <b>comment resolution policy</b>.</div></div>`:null}

/* ---------- Pipelines ---------- */
function PipesView(s, act){
  var run = s.runs.filter(function(r){return r.id===s.openRun;})[0] || s.runs[0];
  var runBtn = html`<button class="btn" onClick=${function(){act({t:"run_dlg",v:"open"});}}>â–· Run pipeline</button>`;

  if(!s.runs.length) return html`<div class="stack">
    <div class="head" style="display:flex;align-items:flex-start;gap:12px">
      <div style="flex:1"><h1 class="h-title">Pipelines</h1><div class="h-sub">Stages contain jobs; jobs contain steps. Learn that hierarchy and YAML pipelines stop being mysterious.</div></div>
      ${runBtn}
    </div>
    ${RunDialog(s, act)}
    <div class="panel"><div class="panel-h">taskapi CI<span class="r mono">azure-pipelines.yml</span></div>
      <div class="empty">This pipeline has never run.<br/>Press <b>â–· Run pipeline</b> above, or push to <code>main</code> to trigger it automatically.</div></div>
  </div>`;

  return html`
  <div class="stack">
    <div class="head" style="display:flex;align-items:flex-start;gap:12px">
      <div style="flex:1">
        <h1 class="h-title">Pipelines</h1>
        <div class="h-sub">One build artifact flows through every environment â€” never rebuilt. Search the phrase <b>build once, deploy many</b>.</div>
      </div>
      ${runBtn}
    </div>
    ${RunDialog(s, act)}

    ${s.gate && s.gate.runId===run.id ? html`<div class="gatebar">
      <div class="txt"><b>Waiting for approval.</b> Stage <span class="mono">${run.stages[s.gate.stageIdx].name}</span> targets environment <span class="mono">${s.gate.env}</span>, which requires a human. Nothing deploys until someone clicks.</div>
      <button class="btn" onClick=${function(){act({t:"approve_gate"});}}>Approve</button>
      <button class="btn danger" onClick=${function(){act({t:"reject_gate"});}}>Reject</button>
    </div>` : null}

    <div class="panel">
      <div class="panel-h">Recent runs<span class="r">${s.runs.length}</span></div>
      <div class="rows">
        ${s.runs.slice(0,6).map(function(r){ return html`<div class="row" key=${r.id} style="cursor:pointer" onClick=${function(){act({t:"open_run",id:r.id});}}>
          ${glyph(r.status,16)}
          <span class="mono sm num" style="color:var(--azure);min-width:38px">#${r.id}</span>
          <div style="flex:1;min-width:0">
            <div class="sm" style="font-weight:${r.id===run.id?600:400}">${r.name}</div>
            <div class="sm dim mono">${r.branch} Â· ${r.commit} Â· ${r.trigger}</div>
          </div>
          ${statusPill(r.status)}
        </div>`; })}
      </div>
    </div>

    <div class="panel">
      <div class="panel-h">
        ${glyph(run.status,16)}<span>Run #${run.id}</span>
        <span class="r mono">${run.commitMsg}</span>
        ${run.status==="running"||run.status==="waiting"
          ? html`<button class="btn ghost" style="padding:2px 10px;font-size:12px;margin-left:8px" onClick=${function(){act({t:"cancel_run",id:run.id});}}>Cancel</button>` : null}
        ${run.status==="failed"||run.status==="canceled"
          ? html`<button class="btn ghost" style="padding:2px 10px;font-size:12px;margin-left:8px" onClick=${function(){act({t:"retry_run",id:run.id});}}>â†» Re-run</button>` : null}
      </div>
      <div class="stagestrip">
        ${run.stages.map(function(st,i){
          return html`<div class=${"stage"+(i===run.cursor.st&&run.status==="running"?" act":"")} key=${i}>
            <div class="stage-n">${glyph(st.status,16)}<span>${st.name}</span></div>
            ${st.env? html`<div class="stage-j">env: ${st.env}${s.envs[st.env].gated?" Â· gated":""}</div>`:null}
            ${st.jobs.map(function(j,k){ return html`<div class="stage-j" key=${k}>â–¸ ${j.name} <span class="dim">(${j.pool})</span></div>`; })}
          </div>`;
        })}
      </div>
      <div class="steplist">
        ${run.stages.map(function(st,si){
          return st.jobs.map(function(j,ji){
            return j.steps.map(function(sp,pi){
              var key=run.id+"-"+si+"-"+ji+"-"+pi;
              var open=!!s.openSteps[key];
              var visible=(sp.logs||[]).slice(0,sp.shown||0);
              return html`<div class="step" key=${key}>
                <button class="step-h" onClick=${function(){act({t:"toggle_step",key:key});}}>
                  ${glyph(sp.status,15)}
                  <span class="nm">${st.name} / ${sp.name}</span>
                  <span class="dur">${sp.duration||""}</span>
                  <span class="dim" style="margin-left:8px">${open?"â–¾":"â–¸"}</span>
                </button>
                ${open&&visible.length ? html`<div class="logs">
                  ${visible.map(function(l,li){
                    var cls="", txt=l;
                    if(l.indexOf("!ERR ")===0){cls="er";txt=l.slice(5);}
                    else if(l.indexOf("!OK ")===0){cls="gd";txt=l.slice(4);}
                    else if(l.indexOf("!WARN ")===0){cls="wr";txt=l.slice(6);}
                    return html`<div class="ln" key=${li}><span class="no">${li+1}</span><span class=${cls}>${txt}</span></div>`;
                  })}
                </div>`:null}
              </div>`;
            });
          });
        })}
      </div>
    </div>
  </div>`;
}

/* ---------- Boards ---------- */
function BoardsView(s, act){
  return html`
  <div class="stack">
    <div class="head">
      <h1 class="h-title">Traceability</h1>
      <div class="h-sub">Work items are the front of the traceability chain: <span class="mono sm">work item â†’ commit â†’ PR â†’ build â†’ artifact â†’ approval â†’ deploy</span>.</div>
    </div>
    <div class="panel">
      <div class="panel-h">Work items<span class="r">Sprint 4</span></div>
      <div class="rows">
        ${s.workItems.map(function(w){
          var linked=s.prs.filter(function(p){return p.workItem===w.id;});
          return html`<div class="row" key=${w.id}>
            <span class="mono sm num" style="color:var(--azure);min-width:34px">#${w.id}</span>
            <span class="pill p-idle">${w.type}</span>
            <div style="flex:1;min-width:0">
              <div class="sm">${w.title}</div>
              ${linked.length? html`<div class="sm dim mono">linked to PR !${linked[0].id} Â· ${linked[0].status}</div>`:null}
            </div>
            <span class=${"pill "+(w.state==="Done"?"p-ok":w.state==="Active"?"p-run":"p-idle")}>${w.state}</span>
          </div>`;
        })}
      </div>
    </div>

    <div class="panel">
      <div class="panel-h">The chain, as an auditor would read it</div>
      <div style="padding:13px">
        ${(function(){
          var pr=s.prs.filter(function(p){return p.workItem;})[0];
          var dep=s.envs.prod.deploys[0];
          var steps=[
            {l:"Work item", v:pr? ("#"+pr.workItem) : "not linked yet", ok:!!pr},
            {l:"Commit",    v:pr? s.repo.branches[pr.source] || "â€”" : "â€”", ok:!!pr},
            {l:"Pull request", v:pr? ("!"+pr.id+" Â· "+pr.status) : "â€”", ok:!!pr&&pr.status==="completed"},
            {l:"Build + artifact", v:dep? ("run #"+dep.run+" Â· drop") : "â€”", ok:!!dep},
            {l:"Approval", v:dep&&dep.approvedBy? dep.approvedBy : "â€”", ok:!!(dep&&dep.approvedBy)},
            {l:"Deploy", v:dep? "prod" : "â€”", ok:!!dep}
          ];
          return html`<div style="display:flex;flex-direction:column;gap:0">
            ${steps.map(function(x,i){ return html`<div class="checkrow" key=${i} style="border:0;padding:6px 0">
              ${glyph(x.ok?"succeeded":"pending",15)}
              <span style="min-width:130px;font-weight:${x.ok?600:400}">${x.l}</span>
              <span class="mono sm dim">${x.v}</span>
            </div>`; })}
          </div>`;
        })()}
        <div class="sm dim" style="margin-top:11px">Every green row is evidence. Complete the chain and you've satisfied what most compliance regimes actually ask for â€” search <b>segregation of duties</b> and <b>audit trail</b>.</div>
      </div>
    </div>
  </div>`;
}
