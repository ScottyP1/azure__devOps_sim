/* ============================================================
   6. APP
   ============================================================ */

function App(){
  var st=useState(initial);
  var s=st[0], set=st[1];
  var readIdx=useState(null), reading=readIdx[0], setReading=readIdx[1];
  var guideS=useState(true), guide=guideS[0], setGuide=guideS[1];
  var thS=useState(236), termH=thS[0], setTermH=thS[1];
  var dragS=useState(false), dragging=dragS[0], setDragging=dragS[1];

  /* drag the grip to resize the terminal; clamped so neither pane vanishes */
  function startDrag(e){
    e.preventDefault();
    var startY=e.clientY, startH=termH, maxH=Math.max(160, (w0()||700)-170);
    setDragging(true);
    try{ document.body.classList.add("resizing"); }catch(_){}
    function move(ev){
      var h=Math.min(maxH, Math.max(90, startH + (startY - ev.clientY)));
      setTermH(h); setMin(false);
    }
    function up(){
      setDragging(false);
      try{ document.body.classList.remove("resizing"); }catch(_){}
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
      window.removeEventListener("pointercancel", up);
    }
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
    window.addEventListener("pointercancel", up);
  }
  function w0(){ try{ return window.innerHeight; }catch(_){ return 700; } }
  var termMin=useState(false), min=termMin[0], setMin=termMin[1];
  var inputRef=useRef(null), outRef=useRef(null);
  var hist=useRef([]), histI=useRef(-1);

  /* The flow position is DERIVED, never chosen: you are at the first phase whose
     objectives aren't all satisfied. Finish one and the next opens by itself. */
  function phaseDone(p){ return p.objectives.every(function(o){ return o.check(s); }); }
  var cursor = FLOW.findIndex(function(p){ return !phaseDone(p); });
  var allDone = cursor === -1;
  if(allDone) cursor = FLOW.length-1;
  var active = reading!==null ? reading : cursor;

  /* pipeline clock */
  useEffect(function(){
    var t=setInterval(function(){
      set(function(prev){
        if(!prev.runs.some(function(r){return r.status==="running";})) return prev;
        var res=advance(prev), runs=res[0], evs=res[1];
        var n=Object.assign({},prev,{runs:runs});
        n.flags=Object.assign({},prev.flags);
        n.envs=JSON.parse(JSON.stringify(prev.envs));
        n.artifacts=prev.artifacts.slice();
        n.term=prev.term.slice();

        evs.forEach(function(e){
          var run=runs.filter(function(r){return r.id===e.runId;})[0];
          if(e.type==="gate"){
            n.gate={runId:e.runId,stageIdx:e.stageIdx,env:e.env};
            n.flags.sawGate=true;
            n.view="pipelines"; n.openRun=e.runId;
            n.term.push({k:"warn",t:"Run #"+e.runId+": stage Deploy_Prod is WAITING for approval on environment 'prod'."});
            n.term.push({k:"dim",t:"Nothing deploys until a human approves. Go to Pipelines and click Approve."});
          }
          if(e.type==="stagedone" && e.env){
            n.envs[e.env].deploys.unshift({run:e.runId,commit:run.commit,msg:run.commitMsg,approvedBy:(e.env==="prod"?USER:null)});
            var art=n.artifacts.filter(function(a){return a.run===e.runId;})[0];
            if(art && art.envs.indexOf(e.env)<0) art.envs.push(e.env);
            n.term.push({k:"ok",t:"Run #"+e.runId+": deployed to "+e.env+"."});
          }
          if(e.type==="stagedone" && e.stage==="Build"){
            n.artifacts.unshift({run:e.runId,commit:run.commit,envs:[]});
          }
          if(e.type==="failed"){
            n.flags.sawRedBuild=true;
            n.term.push({k:"err",t:"Run #"+e.runId+" FAILED. Open the failed step's logs to read the compiler error."});
            if(e.prId) n.term.push({k:"dim",t:"PR !"+e.prId+" is now blocked by its build validation policy."});
          }
          if(e.type==="done"){
            n.term.push({k:"ok",t:"Run #"+e.runId+" succeeded."});
          }
        });
        return n;
      });
    },700);
    return function(){ clearInterval(t); };
  },[]);

  /* keep terminal scrolled */
  useEffect(function(){ if(outRef.current) outRef.current.scrollTop=outRef.current.scrollHeight; },[s.term.length]);

  function act(a){
    set(function(p){
      var n=JSON.parse(JSON.stringify(p));
      if(a.t==="view"){
        n.view=a.v;
        if(a.v==="chain"||a.v==="witems"||a.v==="kanban") n.flags.sawBoards=true;
        if(a.v==="connect") n.flags.sawConnect=true;
        if(a.v==="standup") n.flags.sawStandup=true;
      }
      if(a.t==="open_file") n.openFile=a.p;
      if(a.t==="draft") n[a.k]=a.v;

      /* ---- the Run pipeline panel ---- */
      if(a.t==="run_dlg"){
        n.runDlg = a.v ? {branch:n.repo.head, env:"dev", runTests:true, stages:{}} : null;
      }
      if(a.t==="run_set" && n.runDlg) n.runDlg[a.k]=a.v;
      if(a.t==="run_stage" && n.runDlg) n.runDlg.stages[a.k]=a.v;
      if(a.t==="run_go" && n.runDlg){
        var dlg=n.runDlg, br=dlg.branch;
        var wantDev = dlg.stages.Deploy_Dev!==false, wantProd = dlg.stages.Deploy_Prod!==false;
        var r=newRun(n,{commit:n.repo.branches[br], branch:br, name:"taskapi CI"+((wantDev||wantProd)?"/CD":""),
                        trigger:"Manually queued by "+USER, cd:(wantDev||wantProd)});
        if(wantDev||wantProd){
          r.stages = r.stages.filter(function(st){
            if(st.name==="Deploy_Dev") return wantDev;
            if(st.name==="Deploy_Prod") return wantProd;
            return true;
          });
        }
        n.runs.unshift(r); n.openRun=n.nextRun; n.nextRun++;
        n.runDlg=null; n.view="pipelines"; n.flags.ranPipeline=true;
        n.term.push({k:"cmd",t:"(Run pipeline â€” branch "+br+")"});
        n.term.push({k:"ok",t:"Queued run #"+r.id+" on "+br+" Â· stages: "+r.stages.map(function(x){return x.name;}).join(", ")});
      }
      if(a.t==="cancel_run"){
        n.runs.forEach(function(r){ if(r.id===a.id && (r.status==="running"||r.status==="waiting")){
          r.status="canceled";
          r.stages.forEach(function(st){ if(st.status==="running"||st.status==="pending"||st.status==="waiting") st.status="canceled"; });
        }});
        if(n.gate && n.gate.runId===a.id) n.gate=null;
        n.term.push({k:"warn",t:"Run #"+a.id+" canceled."});
      }
      if(a.t==="retry_run"){
        var old=n.runs.filter(function(r){return r.id===a.id;})[0];
        if(old){
          var again=newRun(n,{commit:old.commit,branch:old.branch,name:old.name,
                              trigger:"Re-run of #"+old.id+" by "+USER, cd:old.stages.length>1, prId:old.prId});
          n.runs.unshift(again); n.openRun=n.nextRun; n.nextRun++;
          if(old.prId) n.prs.forEach(function(p){ if(p.id===old.prId) p.buildRunId=again.id; });
          n.term.push({k:"ok",t:"Re-running #"+old.id+" as #"+again.id+" â€” same commit, fresh agent."});
          n.term.push({k:"dim",t:"Re-running is the first thing to try on a flaky failure. If it passes now, the test is the bug."});
        }
      }
      if(a.t==="resolve_thread"){
        n.prs.forEach(function(p){ if(p.id===a.pr) (p.threads||[]).forEach(function(t){
          if(t.id===a.id){ t.resolved=true; t.reply="Fixed, thanks."; }
        });});
        n.term.push({k:"ok",t:"Comment thread resolved on PR !"+a.pr+"."});
      }
      if(a.t==="branch_from_wi"){
        var wi=n.workItems.filter(function(x){return x.id===a.id;})[0];
        if(wi){
          var slug=wi.title.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,32);
          var nb=(wi.type==="Bug"?"bugfix/":"feature/")+wi.id+"-"+slug;
          if(!n.repo.branches[nb]) n.repo.branches[nb]=n.repo.branches.main;
          n.repo.head=nb; n.wiBranch=n.wiBranch||{}; n.wiBranch[nb]=wi.id;
          if(wi.state==="New") wi.state="Active";
          if(wi.who==="unassigned") wi.who=USER;
          n.flags.createdBranch=true; n.flags.branchFromWi=true;
          n.view="files";
          n.term.push({k:"cmd",t:"(New branch from work item #"+wi.id+")"});
          n.term.push({k:"ok",t:"Created and switched to "+nb});
          n.term.push({k:"dim",t:"Azure names it from the work item and links them, so the PR you open later inherits the link automatically."});
        }
      }

      /* ---- end the day: your teammates get to work ---- */
      if(a.t==="end_day"){
        n.day++;
        var msgs=[
          "Bump jackson-databind to 2.17.2 (CVE-2026-1841)",
          "Add pagination to GET /api/tasks",
          "Fix flaky TaskControllerTest",
          "Tidy application.properties comments"
        ];
        var m=msgs[(n.day-2)%msgs.length];
        var id2=sha();
        n.repo.commits[id2]={sha:id2,msg:m,parent:n.repo.remote.main,author:"Priya Raman",branch:"main",files:["pom.xml"]};
        n.repo.remote.main=id2;   // server moves; your laptop does NOT
        n.teamLog.unshift({who:"Priya Raman",day:n.day,what:"Merged PR to main â€” "+m,tag:"main moved",cls:"p-run"});

        var mine=n.prs.filter(function(p){return p.status==="active";})[0];
        if(mine){
          mine.threads=mine.threads||[];
          if(!mine.threads.length){
            mine.threads.push({id:1,by:"Priya Raman",file:"src/main/java/com/cody/taskapi/web/TaskController.java",line:12,
              text:"Can this return a typed record rather than a String? We have ApiError in shared-java-libs for exactly this."});
            n.teamLog.unshift({who:"Priya Raman",day:n.day,what:"Left a comment on PR !"+mine.id,tag:"needs you",cls:"p-fail"});
          }
          mine.behind=(mine.behind||0)+1;
        }
        n.workItems.forEach(function(w){ if(w.who==="unassigned" && w.state==="New"){ w.who=USER; w.state="New"; } });
        n.view="standup";
        n.term.push({k:"warn",t:"â€” Day "+n.day+" â€”"});
        n.term.push({k:"info",t:"Priya merged to main while you were away. Your local main is now behind."});
        n.term.push({k:"dim",t:"Run 'git pull' to catch up. This is the first thing you do every morning."});
      }
      if(a.t==="edit_file"){
        var fp=n.openFile;
        if(fp){
          n.repo.workdir[fp]="modified"; n.flags.edited=true;
          n.term.push({k:"ok",t:"Edited "+fp+" in the browser."});
          n.term.push({k:"dim",t:"Azure Repos lets you edit without cloning. Same result as 'edit "+fp+"' in the terminal."});
        }
      }
      if(a.t==="ui_commit"){
        var msg=(n.draftMsg||"").trim();
        var br=(n.draftBranch===undefined?n.repo.head:n.draftBranch).trim();
        var files=Object.keys(n.repo.workdir).concat(Object.keys(n.repo.index));
        if(!files.length){ n.term.push({k:"err",t:"Nothing to commit."}); return n; }
        if(!msg){ n.term.push({k:"err",t:"A commit message is required."}); return n; }
        if(br==="main" && n.policy.requirePR){
          n.term.push({k:"cmd",t:"(Commit to main from the browser)"});
          n.term.push({k:"err",t:"TF402455: Pushes to this branch are not permitted; you must use a pull request."});
          n.term.push({k:"info",t:"main is protected. Put the change on its own branch instead â€” type a branch name in the box above."});
          n.flags.pushRejected=true; n.view="branches";
          return n;
        }
        // create the branch if needed, commit everything, push it
        if(!n.repo.branches[br]){ n.repo.branches[br]=n.repo.branches[n.repo.head]; }
        n.repo.head=br; n.flags.createdBranch=true;
        var staged=[];
        Object.keys(n.repo.workdir).forEach(function(p){ staged.push(p); delete n.repo.workdir[p]; });
        Object.keys(n.repo.index).forEach(function(p){ if(staged.indexOf(p)<0) staged.push(p); delete n.repo.index[p]; });
        var id=sha();
        n.repo.commits[id]={sha:id,msg:msg,parent:n.repo.branches[br],author:USER,branch:br,files:staged,
                            broken:staged.some(function(p){return n.repo.broken[p];})};
        n.repo.branches[br]=id;
        staged.forEach(function(p){ if(n.repo.tracked.indexOf(p)<0) n.repo.tracked.push(p); });
        n.repo.remote[br]=id;
        n.pushes.unshift({branch:br,n:1,sha:id,rejected:false});
        n.flags.committed=true; n.flags.staged=true; n.flags.pushedBranch=true;
        n.draftMsg=""; n.draftBranch=undefined;
        n.term.push({k:"cmd",t:"(Commit "+staged.length+" file"+(staged.length>1?"s":"")+" to "+br+")"});
        n.term.push({k:"ok",t:"["+br+" "+id+"] "+msg});
        n.term.push({k:"ok",t:"Branch '"+br+"' pushed to the server."});
        n.term.push({k:"info",t:"Now open a pull request:  az repos pr create --title \""+msg+"\" --work-item 42"});
      }
      if(a.t==="open_wiki") n.openWiki=a.p;
      if(a.t==="switch_repo"){
        if(a.name!==n.activeRepo && REPO_META[a.name]){
          n.repoStore[n.activeRepo]=n.repo;
          n.repo=n.repoStore[a.name];
          delete n.repoStore[a.name];
          n.activeRepo=a.name;
          n.openFile=(n.repo.tracked||[])[0];
          n.term.push({k:"ok",t:"Switched to repository '"+a.name+"'. git commands now target this repo."});
        }
        if(a.go) n.view=a.go;
      }
      if(a.t==="open_pr") n.openPr=a.id;
      if(a.t==="open_run") n.openRun=a.id;
      if(a.t==="toggle_step"){ n.openSteps[a.key]=!n.openSteps[a.key]; if(n.openSteps[a.key]) n.flags.openedLogs=true; }
      if(a.t==="approve_pr"){
        n.prs.forEach(function(pr){ if(pr.id===a.id) pr.reviewers.forEach(function(r){ r.vote=10; }); });
        n.term.push({k:"ok",t:"Priya Raman approved PR !"+a.id+"."});
      }
      if(a.t==="link_wi"){
        n.prs.forEach(function(pr){ if(pr.id===a.id) pr.workItem=a.wi; });
        n.term.push({k:"ok",t:"Linked work item #"+a.wi+" to PR !"+a.id+". That link is the audit trail."});
      }
      if(a.t==="complete_pr"){
        var pr=n.prs.filter(function(x){return x.id===a.id;})[0];
        if(pr){
          pr.status="completed";
          var id=sha();
          n.repo.commits[id]={sha:id,msg:"Merged PR !"+pr.id+": "+pr.title,parent:n.repo.branches.main,author:USER,branch:"main",files:[],broken:false};
          n.repo.branches.main=id; n.repo.remote.main=id;
          n.repo.head="main";
          n.flags.prCompleted=true;
          n.workItems.forEach(function(w){ if(w.id===pr.workItem) w.state="Done"; });
          n.term.push({k:"ok",t:"PR !"+pr.id+" completed. Merge commit "+id+" is on main."});
          n.term.push({k:"info",t:"A merge to main is what normally triggers the CI pipeline. Queue the deploy with:  az pipelines run --cd"});
        }
      }
      if(a.t==="approve_gate" && n.gate){
        var r=n.runs.filter(function(x){return x.id===n.gate.runId;})[0];
        if(r){ r.stages[n.gate.stageIdx].approved=true; r.stages[n.gate.stageIdx].status="pending"; r.status="running"; }
        n.term.push({k:"ok",t:USER+" approved the release to prod. Recorded against the run forever â€” that record is the audit evidence."});
        n.gate=null;
      }
      if(a.t==="reject_gate" && n.gate){
        var r2=n.runs.filter(function(x){return x.id===n.gate.runId;})[0];
        if(r2){ r2.stages[n.gate.stageIdx].status="failed"; r2.status="failed"; }
        n.term.push({k:"warn",t:"Release rejected. The build artifact is untouched â€” you can approve a later run without rebuilding."});
        n.gate=null;
      }
      return n;
    });
  }

  function submit(e){
    e.preventDefault();
    var line=inputRef.current.value;
    if(!line.trim()) return;
    hist.current.unshift(line); histI.current=-1;
    inputRef.current.value="";
    set(function(p){
      var res=runCommand(p, line);
      var n=res.state;
      n.term=(n.term||[]).concat([{k:"cmd",t:line}]).concat(res.out);
      return n;
    });
  }
  function onKey(e){
    if(e.key==="ArrowUp"){ e.preventDefault(); if(histI.current<hist.current.length-1){ histI.current++; inputRef.current.value=hist.current[histI.current]; } }
    if(e.key==="ArrowDown"){ e.preventDefault(); if(histI.current>0){ histI.current--; inputRef.current.value=hist.current[histI.current]; } else { histI.current=-1; inputRef.current.value=""; } }
  }

  var L=FLOW[active];
  var doneCount=L.objectives.filter(function(o){return o.check(s);}).length;
  var labDone=doneCount===L.objectives.length;

  var views={
    connect:ConnectView, standup:StandupView,
    projects:ProjectsView, orgusers:OrgUsersView, billing:BillingView, audit:AuditView, exts:ExtensionsView,
    summary:SummaryView, dash:DashView, wiki:WikiView,
    witems:WorkItemsView, kanban:KanbanView, backlog:BacklogView, sprints:SprintView, queries:QueriesView, plans:PlansView, chain:BoardsView,
    repolist:RepoListView, files:FilesView, commits:CommitsView, pushes:PushesView, branches:BranchesView, tags:TagsView,
    prs:PRsView, forks:ForksView, secure:SecurityView, search:SearchView, repos:ReposView,
    pipelines:PipesView, envs:EnvsView, releases:ReleasesView, library:LibraryView, pools:PoolsView, taskgroups:TaskGroupsView,
    tests:TestsView, testruns:TestRunsView, arts:FeedsView, feeds:FeedsView,
    settings:SettingsView, hooks:HooksView, tokens:TokensView
  };
  var View=views[s.view]||SummaryView;

  var dirtyN=Object.keys(s.repo.workdir).length+Object.keys(s.repo.index).length;
  var runN=s.runs.filter(function(r){return r.status==="running"||r.status==="waiting";}).length;
  var alertN=s.alerts.filter(function(a){return a.state==="Open";}).length;
  var NAV=[
    {g:"My day", ico:I.files, items:[["standup","What changed",s.teamLog.length||null],["connect","Clone / VS Code"]]},
    {g:"Organization", ico:I.over, items:[["projects","Projects",s.projects.length],["orgusers","Users"],["billing","Billing"],["audit","Auditing"],["exts","Extensions"],["tokens","Tokens & SSH"]]},
    {g:"Overview", ico:I.over, items:[["summary","Summary"],["dash","Dashboards"],["wiki","Wiki"]]},
    {g:"Boards", ico:I.boards, items:[["witems","Work items"],["kanban","Board"],["backlog","Backlogs"],["sprints","Sprints"],["queries","Queries"],["plans","Delivery Plans"],["chain","Traceability"]]},
    {g:"Repos", ico:I.repos, items:[["repolist","Repositories",Object.keys(REPO_META).length],["files","Files",dirtyN||null],["commits","Commits"],["pushes","Pushes",s.pushes.length||null],["branches","Branches"],["tags","Tags"],["prs","Pull requests",openPRs(s).length||null],["forks","Forks"],["secure","Advanced Security",alertN||null],["search","Code search"]]},
    {g:"Pipelines", ico:I.pipes, items:[["pipelines","Runs",runN||null],["envs","Environments"],["releases","Releases"],["library","Library"],["taskgroups","Task groups"],["pools","Agent pools"]]},
    {g:"Test Plans", ico:I.tests, items:[["tests","Test plans"],["testruns","Runs"]]},
    {g:"Artifacts", ico:I.arts, items:[["feeds","Feeds",s.artifacts.length||null]]},
    {g:"Project settings", ico:I.set, items:[["settings","Settings"],["hooks","Service hooks"]]}
  ];
  var LABEL={}; NAV.forEach(function(gr){ gr.items.forEach(function(it){ LABEL[it[0]]=gr.g+" / "+it[1]; }); });

  return html`
  <div id="app">
    <div class="topbar">
      <div class="brand">
        <svg class="glyph" viewBox="0 0 24 24" fill="none"><path d="M3 7.5 9.5 3l5 2.2V3L21 6.2v11.6L15.5 21l-9-3.2v3.1L3 17.2z" fill="var(--azure)"/></svg>
        <span>Flight Sim</span>
      </div>
      <div class="crumbs">
        <span>${s.org.name}</span><span>/</span><b>${s.project}</b>
        ${/^(files|commits|pushes|branches|tags|prs|forks|secure|repolist)$/.test(s.view)? html`<span>/</span><span style="color:var(--azure)">${s.activeRepo}</span>`:null}
        <span>/</span><span>${LABEL[s.view]||s.view}</span>
      </div>
      <div class="spacer"></div>
      ${behind(s,"main") ? html`<span class="pill p-wait"><i class="dot"></i>main is ${behind(s,"main")} behind</span>` : null}
      <span class="sm dim">Day ${s.day}</span>
      <button class="daybtn" onClick=${function(){ act({t:"end_day"}); }} title="Let your teammates work overnight">End day â­</button>
      <button class="tbtn" onClick=${function(){ setGuide(!guide); }}>${guide?"Hide guide":"Show guide"}</button>
      <button class="tbtn" onClick=${function(){ set(initial()); }}>Reset</button>
    </div>

    <div class="body">
      <nav class="rail">
        <div class="grp">taskapi</div>
        ${NAV.map(function(gr){
          var here=gr.items.some(function(it){return it[0]===s.view;});
          return html`<${React.Fragment} key=${gr.g}>
            <div class=${"navgrp"+(here?" on":"")}>${icon(gr.ico)}<span>${gr.g}</span></div>
            ${gr.items.map(function(it){ return html`<button class=${"navitem navsub"+(s.view===it[0]?" on":"")} key=${it[0]} onClick=${function(){act({t:"view",v:it[0]});}}>
              <span>${it[1]}</span>${it[2]?html`<span class="cnt num">${it[2]}</span>`:null}
            </button>`; })}
          <//>`;
        })}
      </nav>

      <div class="main">
        <div class="work">${View(s,act)}</div>

        <div class="term" style=${{height:(min?34:termH)+"px"}}>
          <div class=${"term-grip"+(dragging?" drag":"")} onPointerDown=${startDrag}
               role="separator" aria-label="Resize terminal" title="Drag to resize"></div>
          <div class="term-h">
            <span class="t">Terminal â€” ${s.activeRepo}</span>
            <span class="sp"></span>
            <button class="tbtn2" onClick=${function(){ setTermH(Math.min(760, termH+120)); setMin(false); }} title="Taller">taller</button>
            <button class="tbtn2" onClick=${function(){ setTermH(Math.max(90, termH-120)); }} title="Shorter">shorter</button>
            <button class="tbtn2" onClick=${function(){ set(function(p){ return Object.assign({},p,{term:[]}); }); }}>clear</button>
            <button class="tbtn2" onClick=${function(){ setMin(!min); }}>${min?"expand":"minimize"}</button>
          </div>
          ${!min? html`<div class="term-o" ref=${outRef}>
            ${s.term.map(function(l,i){
              if(l.k==="cmd") return html`<div class="l t-cmd" key=${i}><span class="ps">${"PS "+s.activeRepo+">"}</span> ${l.t}</div>`;
              var cls={err:"t-err",ok:"t-ok",warn:"t-warn",info:"t-info",dim:"t-dim"}[l.k]||"";
              return html`<div class=${"l "+cls} key=${i}>${l.t}</div>`;
            })}
          </div>`:null}
          ${!min? html`<form class="term-i" onSubmit=${submit}>
            <span class="ps">${"PS "+s.activeRepo+">"}</span>
            <input ref=${inputRef} onKeyDown=${onKey} autoFocus spellCheck="false" autoComplete="off" placeholder="type a command â€” 'help' lists them all" aria-label="terminal input" />
          </form>`:null}
        </div>
      </div>

      <aside class="lab" style=${guide?null:{display:"none"}}>
        <div class="lab-h">
          <div class="lab-k">The life of one change</div>
          <div class="lab-t">${allDone?"Full circuit flown":"Phase "+(cursor+1)+" of "+FLOW.length}</div>
          <div class="sm dim" style="margin-top:4px">Finish a phase and the next opens on its own. You can't skip â€” neither can a real change.</div>
        </div>

        <ol class="flow">
          ${FLOW.map(function(p,i){
            var done=p.objectives.every(function(o){return o.check(s);});
            var here=i===active, isNext=i===cursor;
            var cls="fl"+(done?" done":"")+(here?" here":"")+(i>cursor&&!done?" locked":"");
            var newStage = i===0 || FLOW[i-1].stage!==p.stage;
            return html`<${React.Fragment} key=${i}>
              ${newStage? html`<li class="fl-stage">${p.stage}</li>`:null}
              <li class=${cls}>
                <button class="fl-b" onClick=${function(){ setReading(i===active?null:i); }} aria-expanded=${here}>
                  <span class="fl-m">${done?"âœ“":isNext?"â—":"â—‹"}</span>
                  <span class="fl-t">${p.title}</span>
                  ${!done&&i<cursor?null:null}
                  <span class="fl-c num">${p.objectives.filter(function(o){return o.check(s);}).length}/${p.objectives.length}</span>
                </button>

                ${here? html`<div class="fl-body">
                  <div class="lab-b" style="border:0;padding:2px 0 10px">${p.brief}</div>
                  ${p.objectives.map(function(o,j){
                    var d=o.check(s);
                    return html`<div class=${"obj"+(d?" done":"")} key=${j} style="padding:7px 0;border-bottom:0"><span class="bx">${d?"âœ“":""}</span><span class="tx">${o.t}</span></div>`;
                  })}
                  ${done? html`<div class="done-banner" style="margin:10px 0 4px">
                    ${i<FLOW.length-1? "Done â€” phase "+(i+2)+" is open below." : "That's the entire loop, end to end."}
                  </div>`:null}
                  <div class="concept" style="margin:10px 0 4px">
                    <div class="k">${p.concept.k}</div>
                    <div class="v">${p.concept.v}</div>
                  </div>
                </div>`:null}
              </li>
            <//>`;
          })}
        </ol>

        ${reading!==null&&reading!==cursor? html`<div class="labnav">
          <button class="btn ghost" onClick=${function(){ setReading(null); }}>Back to where I am</button>
        </div>`:null}
      </aside>
    </div>
  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
})();
</script>

</body>
</html>
